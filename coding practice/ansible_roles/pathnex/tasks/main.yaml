---
- name: Install httpd
  yum:
    name: "{{ package_name }}"
    state: present

- name: Copy website page
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify:
    - Restart httpd

- name: Start httpd service
  service:
    name: "{{ service_name }}"
    state: started
    enabled: yes